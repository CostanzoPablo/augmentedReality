<html>
  <head>
    <script src="vendor/aframe/aframe.min.js"></script>
    <script src="vendor/aframe/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
      <a-entity light="type: directional; intensity: 0.5; castShadow: false"></a-entity>
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      
      <a-entity camera>
        <a-entity 
          gltf-model="models/LogoDedaloGLB.glb"
          scale="0.1 0.1 0.1"
          position="0 -2 -30"
          animation__float="property: position; dir: alternate; dur: 2000; loop: true; to: 0 -1.5 -30; easing: easeInOutSine"
          animation__right="property: rotation; to: 0 45 0; dur: 2000; easing: easeInOutSine; loop: false; dir: normal; startEvents: goRight"
          animation__left="property: rotation; to: 0 -45 0; dur: 2000; easing: easeInOutSine; loop: false; dir: normal; startEvents: goLeft">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const entity = document.querySelector('[gltf-model]');
      function goRight() {
        entity.emit('goRight');
        setTimeout(goLeft, 2000);
      }
      function goLeft() {
        entity.emit('goLeft');
        setTimeout(goRight, 2000);
      }
      goRight();
    </script>
  </body>
</html>
